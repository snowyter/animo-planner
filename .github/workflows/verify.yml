name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: only the newest commit's result matters.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows, deliberately. It is what the app ships on, and the bugs this
    # project has hit -- a main-thread deadlock creating a webview, WebView2
    # behaviour, path handling -- are ones a Linux runner would never see.
    # Actions minutes are free for public repositories.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Without this every run recompiles the whole dependency tree, which is
      # several minutes of the build.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree.
      - name: Install dependencies
        run: npm ci

      # The same command used locally: tsc, vitest, eslint, then clippy and
      # cargo test in both feature configurations. One gate, not a reimplemented
      # subset that can drift from it.
      - name: Verify
        run: npm run verify
